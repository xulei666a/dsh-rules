name: release-1.1.1

on:
  push:
    tags:
      - "v1.1.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v1.1.1
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
