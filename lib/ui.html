<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dsh-rules · 统一准则管理</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --text:#111827; --muted:#6b7280; --accent:#2563eb; --warn:#d97706; --danger:#dc2626; --ok:#059669; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1626; --card:#121d33; --line:#22304d; --text:#e5e7eb; --muted:#94a3b8; --accent:#60a5fa; --warn:#fbbf24; --danger:#f87171; --ok:#34d399; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--card); position:sticky; top:0; z-index:5; }
  h1 { font-size:16px; margin:0 10px 0 0; white-space:nowrap; }
  button { font:inherit; padding:5px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); border-color:var(--danger); }
  button.ghost { border-color:transparent; color:var(--muted); }
  button.small { padding:2px 9px; border-radius:6px; font-size:12.5px; }
  main { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; padding:14px 20px 28px; align-items:start; }
  @media (max-width: 1060px) { main { grid-template-columns: 1fr; } }
  section.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  h2 { font-size:13.5px; margin:0 0 10px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  input, select, textarea { font:inherit; padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  input:focus, select:focus, textarea:focus { outline:2px solid color-mix(in srgb, var(--accent) 35%, transparent); border-color:var(--accent); }
  textarea { min-height:74px; resize:vertical; width:100%; }
  .list { display:flex; flex-direction:column; gap:6px; max-height:66vh; overflow:auto; padding-right:4px; }
  .item { display:grid; grid-template-columns: minmax(0,1fr) auto; gap:4px 12px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:transparent; }
  .item:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .item.active { border-color:var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .item .name { font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .val { grid-column:1; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .tags { grid-row:1 / span 2; grid-column:2; display:flex; gap:6px; align-items:center; }
  .chip { font-size:11.5px; padding:1px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .chip.pending { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 50%, var(--line)); }
  .chip.active { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .chip.deprecated { color:var(--muted); text-decoration:line-through; }
  .chip.warn { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 60%, var(--line)); background:color-mix(in srgb, var(--warn) 10%, transparent); }
  .empty { color:var(--muted); padding:18px 4px; font-size:13px; }
  label.field { display:block; margin-bottom:10px; color:var(--muted); font-size:12.5px; }
  label.field input, label.field select, label.field textarea { display:block; width:100%; margin-top:4px; color:var(--text); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  details.adv { margin:4px 0 12px; border-top:1px dashed var(--line); padding-top:8px; }
  details.adv summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
  .kv { display:grid; grid-template-columns:auto minmax(0,1fr); gap:5px 10px; font-size:12.5px; align-items:baseline; }
  .kv .k { color:var(--muted); white-space:nowrap; }
  .err { color:var(--danger); } .ok { color:var(--ok); }
  .count { color:var(--muted); font-size:12.5px; }
  .panel-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .group-item { display:inline-flex; align-items:center; gap:2px; }
  .group-item .act { font-size:11px; padding:1px 5px; border-radius:6px; border:1px solid var(--line); color:var(--muted); background:transparent; cursor:pointer; }
  .group-item .act:hover { color:var(--text); border-color:var(--accent); }
  .scheme-bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .scheme-bar select { max-width:180px; }
  /* 更多操作菜单 */
  details.menu { position:relative; }
  details.menu > summary { list-style:none; cursor:pointer; font:inherit; font-size:12.5px; padding:2px 9px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--muted); }
  details.menu > summary::-webkit-details-marker { display:none; }
  details.menu > summary:hover { color:var(--text); border-color:var(--accent); }
  details.menu[open] > summary { color:var(--text); border-color:var(--accent); }
  .menu-items { position:absolute; top:calc(100% + 4px); left:0; z-index:30; min-width:132px; display:flex; flex-direction:column; gap:2px; padding:4px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .menu-items button { text-align:left; background:transparent; border-color:transparent; font-size:12.5px; padding:5px 8px; border-radius:6px; }
  .menu-items button:hover { background:color-mix(in srgb, var(--accent) 10%, transparent); border-color:transparent; }
  .menu-items button.danger { color:var(--danger); }
  .cat-bar { display:flex; flex-direction:column; gap:6px; }
  /* 分类卡片 = 与规则卡片完全相同的 .item 卡片结构 */
  .cat-card { border-radius:10px; }
  .cat-card .name { display:flex; align-items:center; gap:6px; min-width:0; }
  .cat-card .chev { color:var(--muted); font-size:9px; flex:none; }
  .cat-card .c-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-card .c-actions, .rule-item .c-actions { display:none; gap:2px; margin-left:4px; }
  .cat-card:hover .c-actions, .rule-item:hover .c-actions { display:inline-flex; }
  .c-actions button { font-size:10px; line-height:1; padding:2px 5px; border-radius:5px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; }
  .c-actions button:hover { color:var(--text); border-color:var(--accent); }
  .sib-row { display:flex; flex-wrap:wrap; gap:6px; }
  .sib { display:inline-flex; align-items:center; gap:5px; font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--muted); cursor:pointer; }
  .sib:hover { color:var(--text); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .path-row { display:flex; align-items:center; gap:8px; padding:6px 11px; border:1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); border-radius:10px; background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--text); font-size:12.5px; cursor:pointer; transition:background-color .45s ease, border-color .45s ease; }
  .path-row:hover { background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .path-row .tri { color:var(--accent); font-size:9px; display:inline-block; transform:rotate(90deg); }
  .path-row .p-title { font-weight:600; }
  .path-row .count { margin-left:auto; color:var(--muted); font-size:11.5px; }
  .path-row { position:relative; }
  /* 折叠把手：栏正上方居中、底边贴着栏顶边；悬停显示，横向宽、纵向很矮 */
  .fold-handle { position:absolute; left:50%; top:-14px; transform:translateX(-50%); width:56px; height:14px; border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-bottom:none; border-radius:8px 8px 0 0; background:var(--card); color:var(--accent); font-size:9px; line-height:14px; text-align:center; cursor:pointer; display:none; z-index:3; }
  .fold-handle::after { content:'⏶'; }
  .path-row:hover .fold-handle, .fold-handle:hover { display:block; }
  /* 折叠：收「上方各层」+「当前层胶囊行」，只保留当前选中栏及下方内容 */
  .crumb-seg { overflow:hidden; padding-top:14px; margin-top:-14px; transition:max-height .45s cubic-bezier(.33,.1,.15,1); position:relative; z-index:2; }
  .crumb-caps { overflow:hidden; transition:max-height .45s cubic-bezier(.33,.1,.15,1); }
  .crumbs { position:relative; z-index:10; }
  .crumbs-restore { display:flex; justify-content:center; padding:0 0 2px; position:relative; z-index:11; }
  .crumbs-restore[hidden] { display:none; }
  .unfold-btn { border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:999px; background:var(--card); color:var(--accent); font-size:11px; padding:1px 12px; cursor:pointer; }
  .unfold-btn:hover { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .rule-item { border-radius:10px; background:color-mix(in srgb, #f5c542 14%, var(--card)); border-color:color-mix(in srgb, #d9a400 26%, var(--line)); }
  @media (prefers-color-scheme: dark) { .rule-item { background:color-mix(in srgb, #f5c542 18%, var(--card)); } }
  /* 选中蓝底渐隐：取消选中时从浅蓝过渡回原本底色 */
  .item { transition: background-color .45s ease, border-color .45s ease; }
  .unassigned-card { border-style:solid; }
  .cat-card, .path-row, .sib, .item[draggable="true"] { cursor:grab; }
  .drag-over { border-color:var(--accent) !important; background:color-mix(in srgb, var(--accent) 14%, transparent) !important; }
  /* 拖到上/下边缘 = 同级换位（插入线） */
  .drop-before { box-shadow: inset 0 3px 0 var(--accent) !important; }
  .drop-after { box-shadow: inset 0 -3px 0 var(--accent) !important; }
  .rule-item.drop-before, .rule-item.drop-after { border-color:var(--accent) !important; }
  .drop-badge { position:fixed; pointer-events:none; z-index:95; background:#111827; color:#f9fafb; font-size:11px; line-height:1.3; padding:2px 6px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .sort-menu { position:fixed; z-index:120; background:#fff; border:1px solid #e5e7eb; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.14); padding:4px; min-width:168px; }
  .sort-menu button { display:block; width:100%; text-align:left; border:0; background:transparent; padding:7px 10px; border-radius:6px; font-size:12.5px; color:#111827; cursor:pointer; }
  .sort-menu button:hover { background:#f3f4f6; }
  .sort-menu button.on { background:#eef2ff; color:#1d4ed8; font-weight:600; }
  .topo-graph { overflow:auto; border:1px solid #e5e7eb; border-radius:10px; background:#fcfcfd; padding:6px; cursor:grab; }
  .topo-graph.panning { cursor:grabbing; user-select:none; }
  .topo-graph svg { display:block; }
  .topo-graph .topo-g:hover rect { stroke:#2563eb; stroke-width:2; }
body.topo-standalone header, body.topo-standalone main { display:none; }
  body.topo-standalone { background:#f9fafb; }
  #topo-page { position:fixed; inset:0; display:flex; flex-direction:column; gap:6px; padding:8px 10px; }
  .topo-modal-card { width:min(1180px,94vw); height:min(82vh,900px); display:flex; flex-direction:column; gap:4px; padding:8px; }
  #topo-view { flex:1; min-height:0; max-height:none; }
  .topo-modal-tip { font-size:11px; color:#9ca3af; text-align:center; flex:0 0 auto; }  #topo-page .topo-graph { flex:1; min-height:0; max-height:none; }
  #topo-page .topo-page-tip { font-size:11.5px; color:#6b7280; flex:0 0 auto; }
  .topo-empty { padding:16px; color:#6b7280; font-size:12.5px; }
  .dm-extra h3 { font-size:12.5px; margin:12px 0 4px; color:#111827; }
  .dm-extra p { font-size:12.5px; line-height:1.7; color:#374151; margin:0 0 6px; }
  .dm-extra .dm-warn { color:#b45309; }
  .dm-acts { margin-top:4px; }
  .rel-list { display:flex; flex-wrap:wrap; gap:6px; }
  .rel-chip { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid #d1d5db; background:#fff; color:#111827; cursor:pointer; display:inline-flex; align-items:center; gap:5px; max-width:100%; }
  .rel-chip:hover { border-color:#2563eb; }
  .rel-why { font-size:10.5px; color:#6b7280; }
  .move-list { display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow:auto; margin:0 0 8px; }
  .move-crumbs { display:flex; flex-direction:column; gap:4px; margin:2px 0 8px; }
  .mv-row { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .mv-arrow { color:#9ca3af; font-size:11px; }
  .mv-section { font-size:11px; color:#9ca3af; margin-top:6px; }
  .move-rule { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 10px; border:1px dashed #e5e7eb; border-radius:8px; font-size:12px; color:#6b7280; }
  .mv-crumb { border:1px solid #e5e7eb; background:#fff; border-radius:999px; padding:2px 9px; font-size:12px; cursor:pointer; color:#374151; }
  .mv-crumb:hover { border-color:#2563eb; }
  .mv-crumb.sel { background:#fef3c7; border-color:#f59e0b; color:#92400e; font-weight:600; }
  .move-card { display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:left; border:1px solid #e5e7eb; background:#fff; border-radius:10px; padding:8px 10px; font-size:12.5px; color:#111827; cursor:pointer; }
  .move-card:hover { border-color:#2563eb; }
  .move-card.sel { background:#fef3c7; border-color:#f59e0b; color:#92400e; }
  .move-card:disabled { opacity:.45; cursor:not-allowed; }
  .mv-sub { font-size:11px; color:#6b7280; }
  .dm-close { position:absolute; right:14px; top:12px; }
  .rules-head { font-size:11.5px; color:#6b7280; margin:10px 2px 4px; }
  .history-list { display:flex; flex-direction:column; gap:6px; max-height:62vh; overflow:auto; margin-bottom:10px; }
  .hist-item { border:1px solid #e5e7eb; border-radius:10px; padding:8px 10px; background:#fff; }
  .hist-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:11.5px; color:#6b7280; }
  .hist-act { font-weight:600; }
  .hist-act.create { color:#047857; }
  .hist-act.update { color:#1d4ed8; }
  .hist-act.remove { color:#b91c1c; }
  .hist-rule { font-size:12.5px; font-weight:600; color:#111827; margin-top:2px; }
  .hist-diff { font-size:12px; color:#374151; margin-top:4px; line-height:1.7; }
  .hist-old { color:#b91c1c; text-decoration:line-through; text-decoration-color:#fca5a5; }
  .hist-new { color:#047857; }
  .hist-empty { padding:18px; text-align:center; color:#6b7280; }
  .amsg { margin:6px 0; display:flex; }
  .amsg .bubble { max-width:82%; padding:6px 10px; border-radius:10px; font-size:12.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .amsg.user { justify-content:flex-end; }
  .amsg.user .bubble { background:#2563eb; color:#fff; }
  .amsg.assistant .bubble { background:#fff; color:#111827; border:1px solid #e5e7eb; }
  .amsg.sys .bubble { background:#fef3c7; color:#92400e; border:1px solid #fde68a; font-size:12px; }
  .amsg .who { font-size:10.5px; color:#6b7280; margin:0 4px; align-self:flex-end; }
  /* ---------- 状态过渡（v0.6.2 行为：元素本体位移/缩放形变） ---------- */
  .morph-layer { position:fixed; inset:0; pointer-events:none; z-index:90; }
  .morph-ghost { position:fixed; margin:0 !important; pointer-events:none; will-change:transform,opacity; }
  .cat-bar.busy { pointer-events:none; }
  /* 动画期间关掉 CSS 过渡，避免和手写 WAAPI 动画互相打架 */
  .cat-bar.busy .item, .cat-bar.busy .path-row, .cat-bar.busy .sib { transition:none !important; }
  /* ---------- 列表外框：工具栏保持固定，下面整块可上下滚动 ---------- */
  /* 列表内容跟随外层缩放，自身不再单独滚动（由 #list-card-zoomwrap 统一滚动） */
  .list-frame { padding-right:0; }
  /* 网页式缩放控件 */
  .zoom-bar { display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:8px; padding:1px 4px; }
  .zoom-bar button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; line-height:1; padding:2px 5px; cursor:pointer; border-radius:5px; }
  .zoom-bar button:hover { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--text); }
  #zoom-val { font-size:11px; color:var(--muted); min-width:34px; text-align:center; }
  .zoom-bar.outer { margin-left:auto; }
  /* 外层缩放的只是框内内容：白框尺寸固定，内容超出时在框内滚动，不会溢出到框外 */
  #list-card { width:100%; box-sizing:border-box; height:calc(100vh - 180px); min-height:420px; display:flex; flex-direction:column; overflow:hidden; }
  #list-card-zoomwrap { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; padding-right:6px; }
  #list-card-zoomwrap::-webkit-scrollbar { width:8px; }
  #list-card-zoomwrap::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--muted) 35%, transparent); border-radius:4px; }
  #list-card-zoomwrap::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--muted) 55%, transparent); }
  #list-card-zoomwrap::-webkit-scrollbar-track { background:transparent; }
  #list-card-inner { transform-origin: top left; }
  /* 所有栏框宽度受控：一律不超过圆角白框，必要时省略/换行，绝不横向撑出 */
  #list-card-inner, #list-card-zoomwrap, .list-frame, .cat-bar, .crumbs, .crumb-seg, .crumb-caps, .level-scroll, .sib-row {
    max-width:100%; min-width:0; box-sizing:border-box;
  }
  .item, .path-row, .sib, .cat-card, .rule-item { max-width:100%; min-width:0; box-sizing:border-box; }
  .sib { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .val, .item .name, .path-row .nm, .rule-item .val { overflow-wrap:anywhere; word-break:break-word; }
  /* ---------- 每级内容：不再自己滚，交给外层缩放容器 ---------- */
  .level-scroll { overflow:visible; display:flex; flex-direction:column; gap:6px; position:relative; z-index:1; }
  @media (prefers-reduced-motion: reduce) { *, .level-scroll, .list-frame, #list-card-zoomwrap { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
  .modal { position:fixed; inset:0; background:transparent; display:flex; align-items:center; justify-content:center; z-index:80; padding:16px; }
  .modal[hidden] { display:none; }
  /* 弹窗一律用白底卡片，文字深色，便于阅读 */
  .modal .card { width:min(580px, 94vw); max-height:88vh; overflow:auto; background:#fff; color:#111827; border:1px solid #e5e7eb; border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,.28); padding:18px 20px; }
  .modal .card h2 { color:#111827; }
  .modal .card .count, .modal .card .empty { color:#4b5563; }
  .modal .card .field { color:#374151; }
  .modal .card .adv summary { color:#374151; }
  .modal .card .kv { color:#374151; }
  .modal .card input, .modal .card textarea, .modal .card select { background:#fff; color:#111827; border:1px solid #d1d5db; }
  .modal .card input::placeholder, .modal .card textarea::placeholder { color:#9ca3af; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .modal-actions .danger { color:#b91c1c; border-color:#fca5a5; }
  /* 暂隐藏的操作按钮（保留 DOM 与事件绑定，后续按需放回） */
  .hidden-admin { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>统一准则</h1>
  <span class="count" id="stat">加载中…</span>
</header>
<main>
  <div style="display:grid;gap:14px">
    <section class="card" id="list-card">
      <div class="panel-title"><h2>准则列表</h2><span class="count" id="tree-hint"></span>
        <span class="zoom-bar outer" title="整体缩放整个准则列表（也可 Ctrl+滚轮）">
          <button id="ozoom-out" type="button" title="整体缩小">－</button>
          <span id="ozoom-val">100%</span>
          <button id="ozoom-in" type="button" title="整体放大">＋</button>
        </span>
      </div>
      <div id="list-card-zoomwrap">
      <div id="list-card-inner">

      let index = meta.index + (mode === 'after' ? 1 : 0);
      // 同一父级内向下移动时，先删除自身会让后面的索引前移
      if (ownMeta && ownMeta.parentId === meta.parentId && ownMeta.index < index) index -= 1;
      await treeAction({ action: 'node-move', nodeId: val, parentId: meta.parentId, index });
    } else if (type === 'rule') {
      const key = val;
      const targetKey = zone.dataset.key;
      if (targetKey === key) return;
      if (mode !== 'into' && targetKey) {
        const nodeId = zone.dataset.node || null;
        const list = (tree.order || {})[nodeId || '__root__'] || [];
        // 以当前可见顺序计算插入位置：目标规则在「该节点规则序列」里的位置
        const visible = all.filter((r) => (r.nodeId || null) === nodeId)
          .sort((a, b) => {
            const pa = list.indexOf(a.key), pb = list.indexOf(b.key);
            if (pa !== pb) return (pa < 0 ? Infinity : pa) - (pb < 0 ? Infinity : pb);
            return (a.category.localeCompare(b.category)) || labelOf(a).localeCompare(labelOf(b), 'zh');
          });
        const ti = visible.findIndex((r) => r.key === targetKey);
        let index = ti < 0 ? null : ti + (mode === 'after' ? 1 : 0);
        if (index !== null) {
          const cur = visible.findIndex((r) => r.key === key);
          if (cur >= 0 && cur < index) index -= 1;
        }
        await treeAction({ action: 'rule-move', key, targetId: nodeId || '__unassigned__', index });
        return;
      }
      if (!targetId || targetId === val) return;
      await treeAction({ action: 'rule-move', key, targetId });
    }
  });
  $('btn-delete').addEventListener('click', async () => {
    if (!selected) return;
    const r = all.find((x) => x.key === selected.key && x.scope === selected.scope);
    if (!(await askConfirm('删除准则', '删除「' + labelOf(r) + '」？')) ) return;
    try { await api('/dsh-rules/remove', { key: selected.key, scope: selected.scope }); closeDetail(); await load(); await audit(); }
    catch (e) { $('save-hint').textContent = '删除失败：' + e.message; }
  });
  ['f-keyword','f-status'].forEach((id) => { const el = $(id); if (el) el.addEventListener('input', renderTree) });
  // 适用面：先选维度；默认/当前对话两个维度再出「是/否」
  const syncCovYn = () => {
    const dim = $('f-coverage').value;
    const show = dim === 'default' || dim === 'session' || dim === 'nondefault';
    $('f-cov-yn').hidden = !show;
    if (!show) $('f-cov-yn').value = 'yes';
    $('f-cov-yn').title = dim === 'default'
      ? '是 = 默认规则；否 = 非默认（局部规则）'
      : dim === 'session'
        ? '是 = 本对话正在生效；否 = 本对话不生效'
        : '是 = 本对话已打开的非默认规则；否 = 其它';
  };
  $('f-coverage').addEventListener('change', () => { syncCovYn(); renderTree() });
  $('f-cov-yn').addEventListener('change', renderTree);
  syncCovYn();
  fillSelects(); load(); audit();
  setInterval(refreshAssistBadge, 20000);
  // 独立窗口：/dsh-rules/ui?topo=<key> —— 整屏只有一张结构图（no buttons）
  (() => {
    const topoParam = new URLSearchParams(location.search).get('topo');
    if (!topoParam) return;
    document.body.classList.add('topo-standalone');
    const page = document.createElement('div');
    page.id = 'topo-page';
    page.innerHTML = '<div id="topo-page-graph" class="topo-graph"></div><div class="topo-page-tip">滚轮缩放 · 拖动平移 · 点方框看该条准则（可编辑 / 让 AI 修改）</div>';
    document.body.appendChild(page);
    const graph = page.querySelector('#topo-page-graph');
    attachTopoPanZoom(graph);
    (async () => {
      try {
        const j = await api('/dsh-rules/topology?key=' + encodeURIComponent(topoParam));
        lastTopology = j.topology || null;
        if (!lastTopology) return;
        document.title = '流程结构 · ' + (lastTopology.focus.title || lastTopology.focus.key);
        renderTopo(graph, lastTopology, 1);
      } catch (e) {
        graph.innerHTML = '<div class="topo-empty">加载失败：' + esc(String(e.message || e)) + '</div>';
      }
    })();
  })();
</script>
